# NexClips static site. Only public/ is published.
# Subresources are same-origin (styles.css, favicon.ico, sample posters and videos).
# Stripe checkout, YouTube attribution, NexParty, and mailto links are top-level
# navigations, not scripts, frames, or fetch calls, so they are not allowlisted.
services:
  - type: web
    name: nexclips
    runtime: static
    # public/ is already the publishable site. `true` satisfies the required build command.
    buildCommand: "true"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'none'; connect-src 'none'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(self), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
